# Tell Bing, Yandex and other IndexNow search engines about changed MeloCut pages after each deploy.
name: MeloCut IndexNow

on:
  push:
    branches: [main]
    paths: ['melocut/site/**']

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for Cloudflare Pages to deploy
        run: sleep 150
      - name: Submit changed pages
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -eu
          HOST=melocut.com
          KEY=68b7f087e97d416532fc9a2670ae388c
          if git cat-file -e "$BEFORE" 2>/dev/null; then
            git diff --name-only "$BEFORE" "$AFTER" -- melocut/site \
              | grep -E '(^|/)index\.html$' \
              | sed -e 's#^melocut/site/##' -e 's#index\.html$##' -e "s#^#https://$HOST/#" > urls.txt || true
          else
            curl -fsS "https://$HOST/sitemap.xml" | grep -oE '<loc>[^<]+' | sed 's/<loc>//' > urls.txt
          fi
          if [ ! -s urls.txt ]; then echo "No page changes"; exit 0; fi
          echo "Submitting $(wc -l < urls.txt) URLs"; cat urls.txt
          python3 - "$HOST" "$KEY" > body.json <<'PY'
          import json, sys
          host, key = sys.argv[1], sys.argv[2]
          urls = [u.strip() for u in open('urls.txt') if u.strip()][:10000]
          print(json.dumps({"host": host, "key": key, "keyLocation": f"https://{host}/{key}.txt", "urlList": urls}))
          PY
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data @body.json)
          echo "IndexNow responded $code"
          case "$code" in 200|202) ;; *) exit 1 ;; esac
