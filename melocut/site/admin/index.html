<style>
  /* Private stats page: not linked anywhere, not in the sitemap, no tracking. */
  body { display: flex; flex-direction: column; height: 100dvh; margin: 0; }
  .abar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  .abar .logo { font-size: 19px; }
  .abar .logo img { width: 28px; height: 28px; }
  .abar .tag { font-size: 12px; font-weight: 700; color: #fff; background: var(--grad); padding: 2px 8px; border-radius: 99px; }
  .abar nav { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .abar nav a { font-size: 13.5px; font-weight: 600; color: var(--muted); text-decoration: none; padding: 6px 10px; border: 1px solid var(--line); border-radius: 9px; white-space: nowrap; }
  .abar nav a:hover { color: var(--brand); border-color: var(--brand); }
  .frame { flex: 1; position: relative; }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
  .frame p { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; color: var(--muted); font-size: 14px; }
  @media (max-width: 640px) { .abar nav { margin-left: 0; width: 100%; overflow-x: auto; flex-wrap: nowrap; } }
</style>
