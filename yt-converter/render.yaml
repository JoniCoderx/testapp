# Render Blueprint for the converter (free plan).
# In Render: New + > Blueprint > pick this repo > set Blueprint Path to yt-converter/render.yaml
services:
  - type: web
    name: yt-converter
    runtime: docker
    plan: free
    rootDir: yt-converter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: RATE_LIMIT_PER_HOUR
        value: "20"
